<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RESPONSE Officer</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RESPONSE">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000}
iframe{border:0;width:100%;height:100%;display:block}
#ib{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;background:#15161a;border:1px solid #26272c;border-radius:14px;padding:14px;display:none;gap:12px;align-items:center;font-family:Barlow,system-ui,sans-serif;color:#e6e6e8;box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:480px;margin:0 auto}
#ib.show{display:flex}
#ib img{width:48px;height:48px;border-radius:11px;flex:none}
#ib .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em}
#ib .s{font-size:13px;color:#a0a1a7;line-height:1.35;margin-top:2px}
#ib .go{background:#e10600;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 14px Barlow,system-ui;cursor:pointer;flex:none}
#ib .go:hover{background:#ff1a10}
#ib .x{background:none;border:0;color:#8a8b91;font-size:22px;line-height:1;cursor:pointer;padding:4px 6px;flex:none;align-self:flex-start}
#ib svg{vertical-align:-3px}
</style>
</head><body>
<iframe src="/App.dc.html" title="RESPONSE Officer" allow="camera;microphone;geolocation"></iframe>
<div id="ib" role="dialog" aria-label="Add RESPONSE to home screen">
  <img src="/app/apple-touch-icon.png" alt="">
  <div style="flex:1;min-width:0"><div class="t">ADD TO HOME SCREEN</div><div class="s" id="ibs">Install RESPONSE for full-screen, one-tap access on shift.</div></div>
  <button class="go" id="ibgo">Install</button>
  <button class="x" id="ibx" aria-label="Not now">×</button>
</div>
<script>
(function(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js',{scope:'/'}).catch(function(){});
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  var snooze = +localStorage.getItem('response.installSnooze') || 0;
  if (Date.now() < snooze) return;
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var safari = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  var ib = document.getElementById('ib'), go = document.getElementById('ibgo'), s = document.getElementById('ibs'), deferred = null;
  function show(){ ib.classList.add('show'); }
  function hide(days){ ib.classList.remove('show'); if (days) localStorage.setItem('response.installSnooze', Date.now() + days*864e5); }
  document.getElementById('ibx').onclick = function(){ hide(3); };
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; show(); });
  go.onclick = function(){
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function(c){ hide(c.outcome === 'accepted' ? 365 : 3); deferred = null; }); }
    else hide(3);
  };
  window.addEventListener('appinstalled', function(){ hide(365); });
  if (ios) {
    s.innerHTML = safari
      ? 'Tap <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e6e6e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> Share, then <b>Add to Home Screen</b>.'
      : 'Open this page in <b>Safari</b>, tap Share, then <b>Add to Home Screen</b>.';
    go.textContent = 'Got it';
    setTimeout(show, 1500);
  }
})();
</script>
</body></html>
