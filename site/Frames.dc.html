<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e9e9eb;font-family:Barlow,system-ui,sans-serif;color:#111214}a{color:#111214}a:hover{color:#e10600}</style>
</helmet>
<div style="padding:40px 44px 60px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap">
    <div style="background:#0b0b0c;padding:12px 16px;display:flex;align-items:center"><img src="assets/logo-lockup.png" alt="RESPONSE · Guarding &amp; response software" style="height:48px;width:auto;display:block"></div>
    <div><div style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6b6c72">Live prototype</div><div style="font-family:'Barlow Condensed';font-weight:800;font-size:40px;line-height:1;margin-top:4px">OFFICER APP + CONTROL ROOM</div></div>
    <div style="font-size:13px;color:#6b6c72;max-width:560px;line-height:1.5">Both frames share one live state. Sign in on the phone, read the docs, book on, scan a checkpoint or hold SOS — the control room updates instantly. Bare routes: <a href="/app" style="font-weight:600">/app</a> (installable) · <a href="/portal" style="font-weight:600">/portal</a>.</div>
    <div style="flex:1"></div>
    <button onClick="{{ resetDemo }}" style="background:#fff;border:1px solid #d6d6da;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:#111214">Reset demo</button>
  </div>
  <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12px;color:#6b6c72;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Officer app · iPhone · /app</div>
      <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
        <iframe src="App.dc.html?inset=54" title="RESPONSE Officer app" style="border:0;width:100%;height:100%;display:block;background:#0b0b0c"></iframe>
      </x-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12px;color:#6b6c72;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Control room · laptop · /portal</div>
      <x-import component-from-global-scope="ChromeWindow" from="./browser-window.jsx" width="{{ 1360 }}" height="{{ 860 }}" url="app.response.security/control" tabs="{{ tabs }}" hint-size="1360px,860px">
        <iframe src="Portal.dc.html" title="RESPONSE Control room" style="border:0;width:100%;height:100%;display:block;background:#f4f4f5"></iframe>
      </x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    return { tabs: [{ title: 'RESPONSE · Control room' }], resetDemo: async () => { const st = await import('./store.js'); st.reset(); sessionStorage.removeItem('response.control'); sessionStorage.removeItem('response.controlUser'); localStorage.removeItem('response.officer'); document.querySelectorAll('iframe').forEach(f => { f.src = f.src; }); } };
  }
}
</script>
</body>
</html>
